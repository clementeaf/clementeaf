service: backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  vpc:
    securityGroupIds:
      - ${env:LAMBDA_SECURITY_GROUP_ID, 'sg-07008cd2c332f0575'}
    subnetIds:
      - ${env:SUBNET_ID_1, 'subnet-080e7f68a48916130'}
      - ${env:SUBNET_ID_2, 'subnet-08323bd8b359d22b9'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:ListBucket
            - s3:PutObject
          Resource:
            - arn:aws:s3:::banados-analytics-data
            - arn:aws:s3:::banados-analytics-data/*
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource:
            - arn:aws:execute-api:${self:provider.region}:*:*/@connections/*
  environment:
    AWS_ENDPOINT_URL: ${env:AWS_ENDPOINT_URL, ''}
    JWT_SECRET: ${env:JWT_SECRET, 'your-secret-key-change-in-production'}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '7d'}
    DB_HOST: ${env:DB_HOST, 'banados-analytics-db.cupsguy6sr11.us-east-1.rds.amazonaws.com'}
    DB_PORT: ${env:DB_PORT, '5432'}
    DB_USERNAME: ${env:DB_USERNAME, 'postgres'}
    DB_PASSWORD: ${env:DB_PASSWORD, 'BanadosAnalytics2024Secure'}
    DB_DATABASE: ${env:DB_DATABASE, 'postgres'}
    ENABLE_SYNC: ${env:ENABLE_SYNC, 'true'}
    CHECKAUDITOR_API_KEY: ${env:CHECKAUDITOR_API_KEY, ''}
    CHECKAUDITOR_BASE_URL: ${env:CHECKAUDITOR_BASE_URL, 'https://app.checkauditor.com'}
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME, 'banados-analytics-data'}
    S3_DATA_KEY: ${env:S3_DATA_KEY, 'Analytics_CtasPorCobrar/combined_data.json'}

package:
  patterns:
    - '!node_modules/**'
    - 'node_modules/typeorm/**'
    - 'node_modules/pg/**'
    - 'node_modules/reflect-metadata/**'
    - 'node_modules/@aws-sdk/**'
    - 'node_modules/bcryptjs/**'
    - 'node_modules/jsonwebtoken/**'
    - 'node_modules/axios/**'
    - 'dist/**'
    - 'package.json'

plugins:
  - serverless-offline


functions:
  # hello:
  #   handler: dist/handlers/hello.handler
  #   events:
  #     - http:
  #         path: hello
  #         method: get
  #         cors: true

  runMigrations:
    handler: dist/handlers/runMigrations.handler
    timeout: 60
    memorySize: 512
    events:
      - http:
          path: migrations/run
          method: post
          cors: true

  register:
    handler: dist/modules/Users/handlers/register.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: auth/register
          method: post
          cors: true

  login:
    handler: dist/modules/Users/handlers/login.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: auth/login
          method: post
          cors: true

  me:
    handler: dist/modules/Users/handlers/me.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: auth/me
          method: get
          cors: true

  logout:
    handler: dist/modules/Users/handlers/logout.handler
    events:
      - http:
          path: auth/logout
          method: post
          cors: true

  # Users endpoints
  getAllUsers:
    handler: dist/modules/Users/handlers/getAllUsers.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: users
          method: get
          cors: true

  getUserById:
    handler: dist/modules/Users/handlers/getUserById.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: users/{id}
          method: get
          cors: true

  # Analytics endpoints
  getCtasPorCobrar:
    handler: dist/modules/Analytics/handlers/getCtasPorCobrar.handler
    events:
      - http:
          path: analytics/ctas-por-cobrar
          method: get
          cors: true

  getDeudasActivas:
    handler: dist/modules/Analytics/handlers/getDeudasActivas.handler
    events:
      - http:
          path: analytics/deudas-activas
          method: get
          cors: true

  getResumenClientes:
    handler: dist/modules/Analytics/handlers/getResumenClientes.handler
    events:
      - http:
          path: analytics/resumen/clientes
          method: get
          cors: true

  getResumenVendedores:
    handler: dist/modules/Analytics/handlers/getResumenVendedores.handler
    events:
      - http:
          path: analytics/resumen/vendedores
          method: get
          cors: true

  getEstadisticas:
    handler: dist/modules/Analytics/handlers/getEstadisticas.handler
    events:
      - http:
          path: analytics/estadisticas
          method: get
          cors: true

  syncData:
    handler: dist/modules/Analytics/handlers/syncData.handler
    timeout: 300
    memorySize: 1024
    events:
      - http:
          path: analytics/sync
          method: post
          cors: true

  # Products endpoints
  syncProducts:
    handler: dist/modules/Products/handlers/syncProducts.handler
    timeout: 600
    memorySize: 1024
    vpc:
      securityGroupIds: []
      subnetIds: []
    events:
      - http:
          path: products/sync
          method: post
          cors: true

  getAllProducts:
    handler: dist/modules/Products/handlers/getAllProducts.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: products
          method: get
          cors: true

  searchProducts:
    handler: dist/modules/Products/handlers/searchProducts.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: products/search
          method: get
          cors: true

  debugProducts:
    handler: dist/modules/Products/handlers/debugProducts.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: products/debug
          method: get
          cors: true

  # CheckAuditor endpoints
  authenticateSession:
    handler: dist/modules/CheckAuditor/handlers/authenticateSession.handler
    events:
      - http:
          path: checkauditor/sessions
          method: post
          cors: true

  getCompanyData:
    handler: dist/modules/CheckAuditor/handlers/getCompanyData.handler
    events:
      - http:
          path: checkauditor/company-data
          method: get
          cors: true

  getNotifications:
    handler: dist/modules/CheckAuditor/handlers/getNotifications.handler
    events:
      - http:
          path: checkauditor/notifications
          method: get
          cors: true

  # Clients endpoints
  createClient:
    handler: dist/modules/Clients/handlers/createClient.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: clients
          method: post
          cors: true

  getClientById:
    handler: dist/modules/Clients/handlers/getClientById.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: clients/{id}
          method: get
          cors: true

  getAllClients:
    handler: dist/modules/Clients/handlers/getAllClients.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: clients
          method: get
          cors: true

  updateClient:
    handler: dist/modules/Clients/handlers/updateClient.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: clients/{id}
          method: put
          cors: true

  deleteClient:
    handler: dist/modules/Clients/handlers/deleteClient.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: clients/{id}
          method: delete
          cors: true

  # Chat endpoints
  createConversation:
    handler: dist/modules/Chat/handlers/createConversation.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: chat/conversations
          method: post
          cors: true

  getConversationById:
    handler: dist/modules/Chat/handlers/getConversationById.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: chat/conversations/{conversationId}
          method: get
          cors: true

  getConversationsByUserId:
    handler: dist/modules/Chat/handlers/getConversationsByUserId.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: chat/conversations/user/{userId}
          method: get
          cors: true

  createMessage:
    handler: dist/modules/Chat/handlers/createMessage.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: chat/messages
          method: post
          cors: true

  getMessagesByConversationId:
    handler: dist/modules/Chat/handlers/getMessagesByConversationId.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: chat/conversations/{conversationId}/messages
          method: get
          cors: true

  markMessageAsRead:
    handler: dist/modules/Chat/handlers/markMessageAsRead.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: chat/messages/{messageId}/read
          method: put
          cors: true

  markConversationMessagesAsRead:
    handler: dist/modules/Chat/handlers/markConversationMessagesAsRead.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: chat/conversations/{conversationId}/messages/read
          method: put
          cors: true

  startTyping:
    handler: dist/modules/Chat/handlers/startTyping.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: chat/typing/start
          method: post
          cors: true

  stopTyping:
    handler: dist/modules/Chat/handlers/stopTyping.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: chat/typing/stop
          method: post
          cors: true

  # Tickets endpoints
  createTicket:
    handler: dist/modules/Tickets/handlers/createTicket.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: tickets
          method: post
          cors: true

  getTicketById:
    handler: dist/modules/Tickets/handlers/getTicketById.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: tickets/{id}
          method: get
          cors: true

  getAllTickets:
    handler: dist/modules/Tickets/handlers/getAllTickets.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: tickets
          method: get
          cors: true

  getTicketsByReporterId:
    handler: dist/modules/Tickets/handlers/getTicketsByReporterId.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: tickets/reporter
          method: get
          cors: true

  getTicketsByAssigneeId:
    handler: dist/modules/Tickets/handlers/getTicketsByAssigneeId.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: tickets/assignee
          method: get
          cors: true

  updateTicket:
    handler: dist/modules/Tickets/handlers/updateTicket.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: tickets/{id}
          method: put
          cors: true

  deleteTicket:
    handler: dist/modules/Tickets/handlers/deleteTicket.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: tickets/{id}
          method: delete
          cors: true

  getPresignedUrl:
    handler: dist/modules/Tickets/handlers/getPresignedUrl.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: tickets/presigned-url
          method: post
          cors: true

  # WebSocket handlers
  websocketConnect:
    handler: dist/modules/Chat/handlers/websocket/connect.handler
    timeout: 30
    memorySize: 512
    events:
      - websocket:
          route: $connect

  websocketDisconnect:
    handler: dist/modules/Chat/handlers/websocket/disconnect.handler
    timeout: 30
    memorySize: 512
    events:
      - websocket:
          route: $disconnect

resources:
  # CORS configurado manualmente en el bucket S3 existente
  # Para actualizar: aws s3api put-bucket-cors --bucket banados-analytics-data --cors-configuration file://cors.json
  Outputs:
    ApiGatewayRestApiId:
      Description: "API Gateway REST API ID"
      Value:
        Ref: ApiGatewayRestApi
      Export:
        Name: ${self:service}-${self:provider.stage}-ApiGatewayRestApiId
    ApiGatewayRestApiRootResourceId:
      Description: "API Gateway Root Resource ID"
      Value:
        Fn::GetAtt:
          - ApiGatewayRestApi
          - RootResourceId
      Export:
        Name: ${self:service}-${self:provider.stage}-ApiGatewayRestApiRootResourceId
    ServiceEndpoint:
      Description: "API Gateway endpoint URL"
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: ApiGatewayRestApi
            - ".execute-api."
            - ${self:provider.region}
            - ".amazonaws.com/"
            - ${self:provider.stage}
      Export:
        Name: ${self:service}-${self:provider.stage}-ServiceEndpoint

custom:
  serverless-offline:
    httpPort: 9500
    host: 0.0.0.0
    lambdaPort: 3002
    useInProcess: true
  localstack:
    stages:
      - local
    endpoint: http://localhost:4566
  serverlessPluginTypescript:
    tsConfigFileLocation: "./tsconfig.json"

