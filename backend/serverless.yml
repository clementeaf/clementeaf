service: backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  vpc:
    securityGroupIds:
      - ${env:LAMBDA_SECURITY_GROUP_ID, 'sg-07008cd2c332f0575'}
    subnetIds:
      - ${env:SUBNET_ID_1, 'subnet-080e7f68a48916130'}
      - ${env:SUBNET_ID_2, 'subnet-08323bd8b359d22b9'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::banados-analytics-data
            - arn:aws:s3:::banados-analytics-data/*
  environment:
    AWS_ENDPOINT_URL: ${env:AWS_ENDPOINT_URL, ''}
    JWT_SECRET: ${env:JWT_SECRET, 'your-secret-key-change-in-production'}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '7d'}
    DB_HOST: ${env:DB_HOST, 'banados-analytics-db.cupsguy6sr11.us-east-1.rds.amazonaws.com'}
    DB_PORT: ${env:DB_PORT, '5432'}
    DB_USERNAME: ${env:DB_USERNAME, 'postgres'}
    DB_PASSWORD: ${env:DB_PASSWORD, 'BanadosAnalytics2024Secure'}
    DB_DATABASE: ${env:DB_DATABASE, 'postgres'}
    ENABLE_SYNC: ${env:ENABLE_SYNC, 'true'}
    CHECKAUDITOR_API_KEY: ${env:CHECKAUDITOR_API_KEY, ''}
    CHECKAUDITOR_BASE_URL: ${env:CHECKAUDITOR_BASE_URL, 'https://app.checkauditor.com'}
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME, 'banados-analytics-data'}
    S3_DATA_KEY: ${env:S3_DATA_KEY, 'Analytics_CtasPorCobrar/combined_data.json'}

plugins:
  - serverless-offline

functions:
  hello:
    handler: dist/handlers/hello.handler
    events:
      - http:
          path: hello
          method: get
          cors: true

  runMigrations:
    handler: dist/handlers/runMigrations.handler
    timeout: 60
    memorySize: 512
    events:
      - http:
          path: migrations/run
          method: post
          cors: true

  register:
    handler: dist/modules/Users/handlers/register.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: auth/register
          method: post
          cors: true

  login:
    handler: dist/modules/Users/handlers/login.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: auth/login
          method: post
          cors: true

  me:
    handler: dist/modules/Users/handlers/me.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: auth/me
          method: get
          cors: true

  logout:
    handler: dist/modules/Users/handlers/logout.handler
    events:
      - http:
          path: auth/logout
          method: post
          cors: true

  # Analytics endpoints
  getCtasPorCobrar:
    handler: dist/modules/Analytics/handlers/getCtasPorCobrar.handler
    events:
      - http:
          path: analytics/ctas-por-cobrar
          method: get
          cors: true

  getDeudasActivas:
    handler: dist/modules/Analytics/handlers/getDeudasActivas.handler
    events:
      - http:
          path: analytics/deudas-activas
          method: get
          cors: true

  getResumenClientes:
    handler: dist/modules/Analytics/handlers/getResumenClientes.handler
    events:
      - http:
          path: analytics/resumen/clientes
          method: get
          cors: true

  getResumenVendedores:
    handler: dist/modules/Analytics/handlers/getResumenVendedores.handler
    events:
      - http:
          path: analytics/resumen/vendedores
          method: get
          cors: true

  getEstadisticas:
    handler: dist/modules/Analytics/handlers/getEstadisticas.handler
    events:
      - http:
          path: analytics/estadisticas
          method: get
          cors: true

  syncData:
    handler: dist/modules/Analytics/handlers/syncData.handler
    timeout: 300
    memorySize: 1024
    events:
      - http:
          path: analytics/sync
          method: post
          cors: true

  # CheckAuditor endpoints
  authenticateSession:
    handler: dist/modules/CheckAuditor/handlers/authenticateSession.handler
    events:
      - http:
          path: checkauditor/sessions
          method: post
          cors: true

  getCompanyData:
    handler: dist/modules/CheckAuditor/handlers/getCompanyData.handler
    events:
      - http:
          path: checkauditor/company-data
          method: get
          cors: true

  getNotifications:
    handler: dist/modules/CheckAuditor/handlers/getNotifications.handler
    events:
      - http:
          path: checkauditor/notifications
          method: get
          cors: true

  # Clients endpoints
  createClient:
    handler: dist/modules/Clients/handlers/createClient.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: clients
          method: post
          cors: true

  getClientById:
    handler: dist/modules/Clients/handlers/getClientById.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: clients/{id}
          method: get
          cors: true

  getAllClients:
    handler: dist/modules/Clients/handlers/getAllClients.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: clients
          method: get
          cors: true

  updateClient:
    handler: dist/modules/Clients/handlers/updateClient.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: clients/{id}
          method: put
          cors: true

  deleteClient:
    handler: dist/modules/Clients/handlers/deleteClient.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: clients/{id}
          method: delete
          cors: true

custom:
  serverless-offline:
    httpPort: 9500
    host: 0.0.0.0
    lambdaPort: 3002
    useInProcess: true
  localstack:
    stages:
      - local
    endpoint: http://localhost:4566
  serverlessPluginTypescript:
    tsConfigFileLocation: "./tsconfig.json"

