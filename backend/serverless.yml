service: backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  versionFunctions: false
  # VPC: Configuración condicional (solo si están definidas las variables)
  vpc:
    securityGroupIds:
      - ${env:LAMBDA_SECURITY_GROUP_ID, 'sg-07008cd2c332f0575'}
    subnetIds:
      - ${env:SUBNET_ID_1, 'subnet-080e7f68a48916130'}
      - ${env:SUBNET_ID_2, 'subnet-08323bd8b359d22b9'}
  iam:
    role:
      statements:
        # S3 acceso a datos
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:ListBucket
            - s3:PutObject
          Resource:
            - arn:aws:s3:::banados-analytics-data
            - arn:aws:s3:::banados-analytics-data/*
        # S3 acceso para documentos OCR
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::banados-ocr-documents
            - arn:aws:s3:::banados-ocr-documents/*
        # Amazon Textract permisos
        - Effect: Allow
          Action:
            - textract:DetectDocumentText
            - textract:AnalyzeDocument
            - textract:StartDocumentAnalysis
            - textract:GetDocumentAnalysis
          Resource: '*'
        # WebSocket connections
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource:
            - arn:aws:execute-api:${self:provider.region}:*:*/@connections/*
        # SES envío de emails
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'
        # Cognito auth
        - Effect: Allow
          Action:
            - cognito-idp:SignUp
            - cognito-idp:InitiateAuth
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminConfirmSignUp
          Resource: '*'
        # Permisos VPC para ENIs (requeridos si Lambda está en VPC)
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
            - ec2:DescribeSubnets
            - ec2:DescribeSecurityGroups
            - ec2:DescribeVpcs
          Resource: '*'
        # Logs explícitos (defensivo)
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: arn:aws:logs:${self:provider.region}:*:log-group:/aws/lambda/*
        # EventBridge para eventos de dominio
        - Effect: Allow
          Action:
            - events:PutEvents
            - events:PutRule
            - events:PutTargets
            - events:DescribeRule
          Resource: '*'
  environment:
    AWS_ENDPOINT_URL: ${env:AWS_ENDPOINT_URL, ''}
    JWT_SECRET: ${env:JWT_SECRET, 'your-secret-key-change-in-production'}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '7d'}
    DB_HOST: ${env:DB_HOST, 'banados-analytics-db.cupsguy6sr11.us-east-1.rds.amazonaws.com'}
    DB_PORT: ${env:DB_PORT, '5432'}
    DB_USERNAME: ${env:DB_USERNAME, 'postgres'}
    DB_PASSWORD: ${env:DB_PASSWORD, 'BanadosAnalytics2024Secure'}
    DB_DATABASE: ${env:DB_DATABASE, 'postgres'}
    ENABLE_SYNC: ${env:ENABLE_SYNC, 'true'}
    CHECKAUDITOR_API_KEY: ${env:CHECKAUDITOR_API_KEY, ''}
    CHECKAUDITOR_BASE_URL: ${env:CHECKAUDITOR_BASE_URL, 'https://app.checkauditor.com'}
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME, 'banados-analytics-data'}
    S3_DATA_KEY: ${env:S3_DATA_KEY, 'Analytics_CtasPorCobrar/combined_data.json'}
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL, 'carriagadafalcone@gmail.com'}
    SES_FROM_NAME: ${env:SES_FROM_NAME, 'noreply@banados.cl'}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, 'us-east-1_ET27TiV8Y'}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, '3ido9jo5thqnl5c05vlna3c0no'}
    COGNITO_REGION: ${env:COGNITO_REGION, 'us-east-1'}
    COGNITO_AUTO_CONFIRM: ${env:COGNITO_AUTO_CONFIRM, 'true'}
    WEBSOCKET_API_ENDPOINT: ${env:WEBSOCKET_API_ENDPOINT, ''}
    WSS_ENDPOINT: ${env:WSS_ENDPOINT, ''}
    EVENT_BRIDGE_BUS_NAME: ${env:EVENT_BRIDGE_BUS_NAME, 'default'}
    EVENT_BRIDGE_SOURCE: ${env:EVENT_BRIDGE_SOURCE, 'banados.quotes'}
    WHATSAPP_SERVICE_URL: ${env:WHATSAPP_SERVICE_URL, 'http://44.200.30.66:3001'}
    OCR_BUCKET_NAME: ${env:OCR_BUCKET_NAME, 'banados-ocr-documents'}
