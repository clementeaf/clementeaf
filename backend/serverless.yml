resources:
  Resources:
    # Dead Letter Queues para eventos de EventBridge
    QuoteCreatedEventDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-quote-created-dlq
        MessageRetentionPeriod: 1209600  # 14 días
        
    QuoteStatusChangedEventDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-quote-status-changed-dlq
        MessageRetentionPeriod: 1209600  # 14 días
  
  # CORS configurado manualmente en el bucket S3 existente
  # Para actualizar: aws s3api put-bucket-cors --bucket banados-analytics-data --cors-configuration file://cors.json
  Outputs:
    ApiGatewayRestApiId:
      Description: "API Gateway REST API ID"
      Value:
        Ref: ApiGatewayRestApi
      Export:
        Name: ${self:service}-${self:provider.stage}-ApiGatewayRestApiId
    ApiGatewayRestApiRootResourceId:
      Description: "API Gateway Root Resource ID"
      Value:
        Fn::GetAtt:
          - ApiGatewayRestApi
          - RootResourceId
      Export:
        Name: ${self:service}-${self:provider.stage}-ApiGatewayRestApiRootResourceId
    ServiceEndpoint:
      Description: "API Gateway endpoint URL"
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: ApiGatewayRestApi
            - ".execute-api."
            - ${self:provider.region}
            - ".amazonaws.com/"
            - ${self:provider.stage}
      Export:
        Name: ${self:service}-${self:provider.stage}-ServiceEndpoint

custom:
  serverless-offline:
    httpPort: 9500
    host: 0.0.0.0
    lambdaPort: 3002
    useInProcess: true
  localstack:
    stages:
      - local
    endpoint: http://localhost:4566
  serverlessPluginTypescript:
    tsConfigFileLocation: "./tsconfig.json"

