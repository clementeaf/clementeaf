    - 'node_modules/@aws-sdk/util-*/**'
    - 'node_modules/@aws-sdk/middleware-*/**'
    - 'node_modules/@aws-sdk/protocol-http/**'
    - 'node_modules/@aws-sdk/smithy-client/**'
    - 'node_modules/@aws-sdk/config-resolver/**'
    - 'node_modules/@aws-sdk/credential-providers/**'
    - 'node_modules/@aws-sdk/region-config-resolver/**'
    - 'node_modules/@aws-sdk/signature-v4/**'
    - 'node_modules/@aws-sdk/url-parser/**'
    - 'node_modules/@aws-sdk/querystring-parser/**'
    - 'node_modules/@aws-sdk/abort-controller/**'
    - 'node_modules/@aws-sdk/fetch-http-handler/**'
    - 'node_modules/@aws-sdk/node-http-handler/**'
    - 'node_modules/@aws-sdk/hash-node/**'
    - 'node_modules/@aws-sdk/hash-stream-node/**'
    - 'node_modules/@aws-sdk/stream-collector-node/**'
    - 'node_modules/@aws-sdk/util-base64-node/**'
    - 'node_modules/@aws-sdk/util-body-length-node/**'
    - 'node_modules/@aws-sdk/util-user-agent-node/**'
    - 'node_modules/@aws-sdk/util-utf8-node/**'
    - 'node_modules/@aws-sdk/types/**'
    - 'node_modules/@smithy/**'
    - 'node_modules/tslib/**'
    - 'node_modules/fast-xml-parser/**'
    - 'node_modules/bcryptjs/**'
    - 'node_modules/jsonwebtoken/**'
    - 'node_modules/axios/**'
    - 'node_modules/@aws-sdk/client-cognito-identity-provider/**'
    - 'node_modules/node-fetch/**'
    - 'node_modules/jwk-to-pem/**'
    - 'node_modules/asn1.js/**'
    - 'node_modules/elliptic/**'
    - 'node_modules/safe-buffer/**'
    - 'node_modules/safer-buffer/**'
    - 'node_modules/bn.js/**'
    - 'node_modules/brorand/**'
    - 'node_modules/hash.js/**'
    - 'node_modules/hmac-drbg/**'
    - 'node_modules/inherits/**'
    - 'node_modules/minimalistic-assert/**'
    - 'node_modules/minimalistic-crypto-utils/**'
    - 'dist/**'
    - 'package.json'
  excludeDevDependencies: true

