<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp QR Code</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: white;
            color: #333;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            margin-top: 0;
            color: #25D366;
        }
        .qr-container {
            margin: 2rem 0;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 8px;
        }
        #qrImage {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .status {
            margin: 1rem 0;
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: 500;
        }
        .status.authenticating {
            background: #fff3cd;
            color: #856404;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        .instructions {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #e7f3ff;
            border-radius: 6px;
            color: #004085;
            text-align: left;
        }
        .instructions ol {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }
        .instructions li {
            margin: 0.5rem 0;
        }
        button {
            background: #25D366;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 0.5rem;
        }
        button:hover {
            background: #20ba5a;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #25D366;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 WhatsApp QR Code</h1>
        <div id="status" class="status disconnected">Cargando estado...</div>
        <div class="qr-container">
            <div id="loading" class="loading"></div>
            <img id="qrImage" style="display: none;" alt="QR Code">
            <p id="noQr" style="display: none;">No hay QR Code disponible</p>
        </div>
        <div>
            <button onclick="refreshStatus()">🔄 Actualizar</button>
            <button onclick="connect()" id="connectBtn">🔌 Conectar</button>
        </div>
        <div class="instructions">
            <strong>Instrucciones:</strong>
            <ol>
                <li>Abre WhatsApp en tu teléfono</li>
                <li>Ve a Configuración → Dispositivos vinculados</li>
                <li>Toca "Vincular un dispositivo"</li>
                <li>Escanea el código QR que aparece arriba</li>
            </ol>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/whatsapp';
        
        /**
         * Actualiza el estado y el QR Code
         */
        async function refreshStatus() {
            try {
                const response = await fetch(`${API_URL}/status`);
                const data = await response.json();
                
                if (data.success) {
                    const status = data.data.status;
                    const qrCode = data.data.qrCode;
                    
                    // Actualizar estado
                    const statusEl = document.getElementById('status');
                    statusEl.textContent = `Estado: ${status}`;
                    statusEl.className = `status ${status}`;
                    
                    // Mostrar QR Code si está disponible
                    const qrImage = document.getElementById('qrImage');
                    const noQr = document.getElementById('noQr');
                    const loading = document.getElementById('loading');
                    
                    if (qrCode) {
                        qrImage.src = qrCode;
                        qrImage.style.display = 'block';
                        noQr.style.display = 'none';
                        loading.style.display = 'none';
                    } else {
                        qrImage.style.display = 'none';
                        noQr.style.display = status === 'connected' ? 'none' : 'block';
                        loading.style.display = status === 'authenticating' ? 'block' : 'none';
                    }
                    
                    // Actualizar botón de conectar
                    const connectBtn = document.getElementById('connectBtn');
                    if (status === 'connected') {
                        connectBtn.disabled = true;
                        connectBtn.textContent = '✅ Conectado';
                    } else {
                        connectBtn.disabled = false;
                        connectBtn.textContent = '🔌 Conectar';
                    }
                }
            } catch (error) {
                console.error('Error al obtener estado:', error);
                document.getElementById('status').textContent = 'Error al conectar con el servidor';
            }
        }
        
        /**
         * Inicia la conexión
         */
        async function connect() {
            try {
                const connectBtn = document.getElementById('connectBtn');
                connectBtn.disabled = true;
                connectBtn.textContent = '⏳ Conectando...';
                
                const response = await fetch(`${API_URL}/connect`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    // Esperar un momento y actualizar
                    setTimeout(refreshStatus, 2000);
                } else {
                    alert('Error: ' + (data.error || 'Error desconocido'));
                    connectBtn.disabled = false;
                    connectBtn.textContent = '🔌 Conectar';
                }
            } catch (error) {
                console.error('Error al conectar:', error);
                alert('Error al conectar con el servidor');
                const connectBtn = document.getElementById('connectBtn');
                connectBtn.disabled = false;
                connectBtn.textContent = '🔌 Conectar';
            }
        }
        
        // Cargar estado inicial
        refreshStatus();
        
        // Actualizar automáticamente cada 3 segundos
        setInterval(refreshStatus, 3000);
    </script>
</body>
</html>
